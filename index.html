<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт ТКПСТ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">MySite</h1>
      <nav class="nav">
        <a href="#home">Главная</a>
        <a href="#about">О нас</a>
        <a href="#contact">Контакты</a>
        <a href="#">Дополнительно</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="container">
        <h2>ТКПСТ</h2>
        <p>Это пример сайта для работы с GitHub.</p>
        <a href="#about" class="btn">Узнать больше</a>
      </div>
    </section>

    <section id="about" class="about">
      <div class="container">
        <h2>О нас</h2>
        <div class="cards">
          <div class="card">
            <h3>HTML</h3>
            <p>Структура страницы</p>
          </div>
          <div class="card">
            <h3>CSS</h3>
            <p>Оформление и стиль</p>
          </div>
          <div class="card">
            <h3>GitHub</h3>
            <p>Хранение и публикация</p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="container">
        <h2>Контакты</h2>
        <p>Email: example@mail.com</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 MySite. Пример для GitHub.</p>
    </div>
  </footer>
</body>
</html>
